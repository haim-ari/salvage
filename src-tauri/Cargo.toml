[package]
name = "salvage"
version = "0.1.0"
edition = "2021"
description = "Fast native restore client for iCloud Drive deleted files"
license = "MIT"
authors = ["Haim Ari"]
repository = "https://github.com/haim-ari/salvage"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "http2", "cookies"] }
futures = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
filetime = "0.2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
