version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    groups:
      cargo:
        patterns: ["*"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      bun:
        patterns: ["*"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }
